[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

build_src_filter =
    +<receiver/>

[env:native]
platform = native

build_src_filter =
    +<receiver_tests/>
    +<receiver/ReceiverStateTable.cpp>
    +<receiver/WarningManager.cpp>
    +<receiver/PriorityManager.cpp>
    +<test/stubs/Arduino.cpp>

build_flags =
    -Itest/stubs