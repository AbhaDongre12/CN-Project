[platformio]
src_dir = .

[env:esp32dev]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino

monitor_speed = 115200

build_src_filter =
    +<receiver/>

[env:native]
platform = native

build_src_filter =
    +<sender/StateTable.cpp>
    +<sender/ChangeDetector.cpp>
    +<sender/MessageComposer.cpp>
    +<test/stubs/Arduino.cpp>
    +<sender/sender_message_composer_test.cpp>

build_flags =
    -Icommon
    -Itest/stubs

[env:person1_hcsr04]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino

monitor_speed = 115200

build_src_filter =
    +<person1_example/>
    +<common/object_tracker.cpp>     


[env:person2_sender]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino

monitor_speed = 115200

build_src_filter =
    +<sender/main.cpp>
    +<sender/CommunicationManager.cpp>
    +<sender/MessageComposer.cpp>
    +<sender/ChangeDetector.cpp>
    +<sender/StateTable.cpp>
    +<common/object_tracker.cpp>

build_flags =
    -Icommon
